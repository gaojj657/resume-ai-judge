{% extends 'base.html' %}{% block content %}<div class="settings-grid"><section class="panel"><div class="section-heading"><div><h2>OpenAI连接</h2><p>密钥仅在服务端加密保存</p></div><span id="key-status" class="pill">读取中</span></div><form id="settings-form"><label>API地址<input id="api-base" type="url" required value="https://api.openai.com/v1"></label><label>模型名称<input id="api-model" required placeholder="填写账户可用的模型名称"><small>模型需要支持Responses API和Structured Outputs。</small></label><label>API密钥<input id="api-key" type="password" autocomplete="new-password" placeholder="输入新密钥；留空保留现有密钥"></label><button class="button primary">保存连接配置</button></form></section><section class="panel help-panel"><p class="eyebrow">HOW IT WORKS</p><h2>让评分有据可依</h2><ol><li>岗位标准由你确认，合计100分。</li><li>模型提取经历并逐项判断。</li><li>后台校验JSON、分数与原文引用。</li><li>你决定推进，并跟踪面试进度。</li></ol><p class="caption">重新评估会生成新报告，原报告和招聘进度保持可回看。图片与扫描PDF需要安装本地OCR依赖。</p></section></div><section class="panel"><h2>文件清理状态</h2><p class="muted">删除资料后，后台清理原文件；失败时可重试。</p><div id="maintenance"></div></section>{% endblock %}
