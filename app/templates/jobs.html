{% extends 'base.html' %}{% block header_action %}<button class="button primary" id="new-job">＋ 新建岗位</button>{% endblock %}
{% block content %}<div id="jobs-grid" class="jobs-grid"></div>
<dialog id="job-dialog" class="wide-dialog"><form id="job-form"><div class="section-heading"><div><p class="eyebrow">POSITION & CRITERIA</p><h2 id="job-dialog-title">新建岗位</h2></div><button type="button" class="icon-button close-dialog">✕</button></div><div class="form-grid"><label>岗位名称<input id="job-name" required maxlength="200" placeholder="例如：Python后端开发实习生"></label><label>岗位说明<input id="job-description" placeholder="地点、团队、招聘备注等"></label></div><label>岗位JD<textarea id="job-jd" required rows="6" placeholder="粘贴岗位描述，或上传JD文档…"></textarea></label><div class="toolbar"><label class="button file-label">↥ 上传JD<input type="file" id="jd-file" accept=".pdf,.docx,.png,.jpg,.jpeg" hidden></label><button type="button" id="draft-criteria" class="button">✦ AI生成评分草稿</button><span class="muted" id="draft-status"></span></div>
<div class="section-heading"><div><h3>评分标准</h3><p>必须项为硬性要求；不满足仍允许人工推进。</p></div><span id="score-total" class="pill">0 / 100分</span></div><div id="criteria-editor"></div><button type="button" class="button" id="add-criterion">＋ 添加评分项</button><div class="dialog-footer"><span class="muted">AI草稿须检查后保存。历史报告保留原标准。</span><button class="button primary" id="save-job">保存岗位</button></div></form></dialog>{% endblock %}
