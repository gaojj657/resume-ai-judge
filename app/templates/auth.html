<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ '创建管理员' if setup else '登录' }} · 简历研判</title><link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}"></head>
<body class="auth-body"><div class="auth-card"><span class="brand-icon">R</span><p class="eyebrow">RESUME JUDGE</p><h1>{{ '欢迎，创建工作台' if setup else '欢迎回来' }}</h1><p class="muted">{{ '设置一个管理员账号，即可开始招聘研判。请在本机首次初始化。' if setup else '登录你的招聘工作台。' }}</p>
{% if error %}<div class="notice danger">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>用户名<input name="username" required maxlength="100" autocomplete="username" autofocus></label><label>密码<input name="password" type="password" required minlength="{{ 10 if setup else 1 }}" autocomplete="{{ 'new-password' if setup else 'current-password' }}"></label><button class="button primary full">{{ '创建并进入' if setup else '登录工作台' }} →</button></form><small class="muted">AI提供匹配分析，推进决定由你做出。</small></div></body></html>
