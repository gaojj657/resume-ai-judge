{% extends 'base.html' %}{% block header_action %}<a class="button" href="/evaluations">← 评估记录</a>{% endblock %}{% block content %}<div id="report-app" data-id="{{ evaluation_id }}"><div class="notice" id="report-status">正在读取报告…</div><div id="report-content"></div><section class="panel" id="decision-panel" hidden><div class="section-heading"><div><h2>人工推进决定</h2><p>硬性要求缺口不阻止推进，请结合报告自行判断。</p></div><span id="decision-state" class="pill"></span></div><label>备注<textarea id="decision-note" rows="2" placeholder="记录推进或暂不推进的原因（可选）"></textarea></label><div class="toolbar"><button class="button primary" id="advance">推进面试 →</button><button class="button" id="reject">不推进 / 撤回推进</button></div></section><div class="toolbar"><button class="button" id="retry-evaluation" hidden>重新评估</button><a class="button" id="report-file">下载原简历</a><button class="button danger-outline" id="delete-evaluation">删除报告</button></div><details class="panel" id="snapshot-panel"><summary>查看评估使用的简历和岗位快照</summary><pre id="snapshot-text"></pre></details></div>{% endblock %}
