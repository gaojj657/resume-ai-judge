{% extends 'base.html' %}{% block content %}<div class="filters panel"><label>搜索<input id="search" placeholder="姓名、电话或邮箱"></label><label>岗位<select id="job-filter"><option value="">全部岗位</option></select></label><label>招聘阶段<select id="stage-filter"><option value="">全部阶段</option>{% for key,label in stages.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label><button class="button" id="search-candidates">查询</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>候选人</th><th>对应岗位</th><th>推进依据分</th><th>当前阶段</th><th>最近更新</th><th></th></tr></thead><tbody id="candidates-table"></tbody></table></div><div class="pagination"><button class="button" id="prev-page">上一页</button><span id="page-info"></span><button class="button" id="next-page">下一页</button></div></section><dialog id="stage-dialog"><div class="section-heading"><h2 id="stage-title">招聘进度</h2><button class="icon-button close-dialog">✕</button></div><label>当前阶段<select id="new-stage">{% for key,label in stages.items() %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></label><label>备注<textarea id="stage-note" rows="2"></textarea></label><label>变更方式<select id="correction-event"><option value="">正常更新（保留曾到达阶段）</option></select></label><p class="caption">纠正错误历史会使该事件及其后续变更无效，并以所选阶段作为当前状态。</p><button class="button primary full" id="save-stage">保存进度</button><hr><h3>阶段历史</h3><div id="stage-history"></div><div class="toolbar"><a id="basis-report" class="button">查看推进报告</a><button id="delete-candidate" class="button danger-outline">删除候选人全部资料</button></div></dialog>{% endblock %}
